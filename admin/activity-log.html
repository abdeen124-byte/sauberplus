<style>
.log-row{padding:14px 18px;border-radius:14px;background:var(--card);border:1px solid var(--border);margin-bottom:8px}
.log-row-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;cursor:pointer}
.log-row-main{font-size:13.5px}
.log-row-time{font-size:11.5px;color:rgba(255,255,255,.4);white-space:nowrap}
.log-row-details{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);gap:14px}
.log-row-details[data-open="true"]{display:grid;grid-template-columns:1fr 1fr}
.log-row-details pre{font-size:11px;color:rgba(255,255,255,.6);white-space:pre-wrap;word-break:break-word;background:rgba(0,0,0,.2);border-radius:8px;padding:10px;margin:6px 0 0;max-height:220px;overflow:auto}
.log-action-badge{font-weight:700}
.log-action-badge[data-action="create"]{color:#4ade80}
.log-action-badge[data-action="update"]{color:#4d8cff}
.log-action-badge[data-action="delete"]{color:#ff6b6b}
.log-action-badge[data-action="login"]{color:var(--gray)}
</style>
</head>
<body>
<div class="admin-shell" id="adminShell" hidden>
  <div class="admin-shell-layout">

    <aside class="admin-sidebar" id="adminSidebar" data-open="false">
      <div class="admin-sidebar-logo"><span class="bl">Sauber</span><span class="gr">Plus</span> <span style="color:var(--gray);font-weight:600;font-size:12px">Admin</span></div>
      <ul class="admin-nav-list">
        <li><a class="admin-nav-link" href="dashboard.html"><span class="admin-nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"></rect><rect x="13" y="3" width="8" height="8" rx="2"></rect><rect x="3" y="13" width="8" height="8" rx="2"></rect><rect x="13" y="13" width="8" height="8" rx="2"></rect></svg></span><span data-i18n="nav.dashboard">Übersicht</span></a></li>
        <li><a class="admin-nav-link" href="announcements.html"><span class="admin-nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 10v4a2 2 0 0 0 2 2h1l9 5V3l-9 5H6a2 2 0 0 0-2 2z"></path><path d="M18 9a4 4 0 0 1 0 6"></path></svg></span><span data-i18n="nav.announcements">Ankündigungen</span></a></li>
        <li><a class="admin-nav-link" href="gallery.html"><span class="admin-nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 8h4l2-3h4l2 3h4v11H4z"></path><circle cx="12" cy="13.5" r="3.2"></circle></svg></span><span data-i18n="nav.gallery">Galerie</span></a></li>
        <li class="admin-nav-divider" data-role-gate="super_admin" role="separator"></li>
        <li data-role-gate="super_admin"><span class="admin-nav-section-label" data-i18n="nav.management">Verwaltung</span></li>
        <li data-role-gate="super_admin"><a class="admin-nav-link" href="users.html"><span class="admin-nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"></circle><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"></path><circle cx="17" cy="8.5" r="2.4"></circle><path d="M16 14.3c2.6.5 4.5 2.5 4.5 5.7"></path></svg></span><span data-i18n="nav.users">Team</span></a></li>
        <li data-role-gate="super_admin"><a class="admin-nav-link" href="activity-log.html"><span class="admin-nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.5 2"></path></svg></span><span data-i18n="nav.activityLog">Aktivitätsprotokoll</span></a></li>
        <li data-role-gate="super_admin"><a class="admin-nav-link" href="settings.html"><span class="admin-nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 13a7.97 7.97 0 0 0 0-2l2-1.5-2-3.5-2.4 1a8 8 0 0 0-1.7-1L15 3h-4l-.3 2.5a8 8 0 0 0-1.7 1l-2.4-1-2 3.5L6.6 11a7.97 7.97 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a8 8 0 0 0 1.7 1L11 21h4l.3-2.5a8 8 0 0 0 1.7-1l2.4 1 2-3.5z"></path></svg></span><span data-i18n="nav.settings">Einstellungen</span></a></li>
      </ul>
    </aside>
    <div class="admin-sidebar-scrim" id="adminSidebarScrim" data-open="false"></div>

    <div class="admin-content-area">
      <header class="admin-topbar">
        <button type="button" class="admin-sidebar-toggle" id="sidebarToggle" data-i18n-aria-label="common.menuOpen" aria-label="Menü öffnen">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"></path></svg>
        </button>
        <div class="admin-topbar-right">
          <span data-lang-switcher-mount></span>
          <span id="topbarUser"></span>
          <button type="button" class="admin-logout-btn" id="logoutBtn" data-i18n="common.logout">Abmelden</button>
        </div>
      </header>

      <main class="admin-main">
        <div class="admin-page-header">
          <div>
            <h1 class="admin-page-title" data-i18n="activityLog.title">Aktivitätsprotokoll</h1>
            <p class="admin-page-sub" data-i18n="activityLog.subtitle">Jede Änderung wird automatisch protokolliert — Benutzer, Zeitpunkt, Aktion, vorher/nachher.</p>
          </div>
        </div>

        <div class="admin-tabs" id="entityTabs">
          <button type="button" class="admin-tab active" data-entity="" data-i18n="activityLog.entity.all">Alle</button>
          <button type="button" class="admin-tab" data-entity="announcements" data-i18n="activityLog.entity.announcements">Ankündigungen</button>
          <button type="button" class="admin-tab" data-entity="gallery_images" data-i18n="activityLog.entity.gallery">Galerie</button>
          <button type="button" class="admin-tab" data-entity="user_profiles" data-i18n="activityLog.entity.accounts">Konten</button>
        </div>

        <div id="listContainer"><div class="admin-loading-block" data-i18n="common.loading">Wird geladen …</div></div>
        <div style="text-align:center;margin-top:18px">
          <button type="button" class="btn-secondary" id="loadMoreBtn" style="display:none" data-i18n="activityLog.loadMore">Mehr laden</button>
        </div>
      </main>
    </div>
  </div>
</div>

<script src="js/vendor/supabase.js"></script>
