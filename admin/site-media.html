<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://kgkrgbkiqitnvntbyyct.supabase.co; media-src 'self' blob: https://kgkrgbkiqitnvntbyyct.supabase.co; connect-src 'self' https://kgkrgbkiqitnvntbyyct.supabase.co; form-action 'self'; upgrade-insecure-requests">
<meta name="robots" content="noindex,nofollow"><title>Website-Medien – SauberPlus Admin</title>
<link rel="stylesheet" href="../css/sauberplus.css"><link rel="stylesheet" href="css/admin.css"><script src="js/admin-i18n.js"></script>
</head>
<body>
<div class="admin-shell" id="adminShell" hidden><div class="admin-shell-layout">
<aside class="admin-sidebar" id="adminSidebar" data-open="false"><div class="admin-sidebar-logo"><span class="bl">Sauber</span><span class="gr">Plus</span> <span style="color:var(--gray);font-size:12px">Admin</span></div><ul class="admin-nav-list"><li><a class="admin-nav-link" href="dashboard.html">Übersicht</a></li><li><a class="admin-nav-link" href="announcements.html">Ankündigungen</a></li><li><a class="admin-nav-link" href="gallery.html">Galerie</a></li><li><a class="admin-nav-link" href="time-tracking.html">Mitarbeiter &amp; Zeiterfassung</a></li></ul></aside><div class="admin-sidebar-scrim" id="adminSidebarScrim" data-open="false"></div>
<div class="admin-content-area"><header class="admin-topbar"><button type="button" class="admin-sidebar-toggle" id="sidebarToggle" aria-label="Menü öffnen">☰</button><div class="admin-topbar-right"><span data-lang-switcher-mount></span><span id="topbarUser"></span><button type="button" class="admin-logout-btn" id="logoutBtn">Abmelden</button></div></header>
<main class="admin-main"><div class="admin-page-header"><div><h1 class="admin-page-title">Website-Medien</h1><p class="admin-page-sub">Personen, Fahrzeug und Präsentationsmedien zentral verwalten.</p></div></div>
<div class="admin-tabs" id="mediaTabs"><button class="admin-tab active" data-panel="people" type="button">Personen</button><button class="admin-tab" data-panel="vehicle" type="button">Fahrzeug</button><button class="admin-tab" data-panel="hero" type="button">Präsentation</button></div>

<section data-media-panel="people"><form class="form-card" id="personForm"><h3>Person hinzufügen</h3><div class="admin-form-grid"><div class="fg"><label>Name</label><input id="personName" maxlength="120" required></div><div class="fg"><label>Bild</label><input id="personFile" type="file" accept="image/jpeg,image/png,image/webp" required></div></div><div class="admin-form-grid"><div class="fg"><label>Position (Deutsch)</label><input id="personRoleDe" required></div><div class="fg"><label>Position (Arabisch)</label><input id="personRoleAr" dir="rtl"></div></div><div class="fg"><label>Beschreibung (Deutsch)</label><textarea id="personDescriptionDe" maxlength="1000"></textarea></div><div class="fg"><label>Beschreibung (Arabisch)</label><textarea id="personDescriptionAr" maxlength="1000" dir="rtl"></textarea></div><button class="btn-send" type="submit" style="width:auto">Speichern</button></form><div id="peopleList" class="admin-card-grid" style="margin-top:18px"></div></section>

<section data-media-panel="vehicle" hidden><form class="form-card" id="vehicleForm"><h3>Fahrzeugbild ersetzen</h3><div class="fg"><label>Bild (JPG, PNG oder WebP · max. 5 MB)</label><input id="vehicleFile" type="file" accept="image/jpeg,image/png,image/webp" required></div><button class="btn-send" type="submit" style="width:auto">Hochladen</button></form><div id="vehicleList" class="admin-card-grid" style="margin-top:18px"></div></section>

<section data-media-panel="hero" hidden><form class="form-card" id="heroForm"><h3>Präsentationsmedium hinzufügen</h3><div class="admin-form-grid"><div class="fg"><label>Typ</label><select id="heroType"><option value="image">Bild</option><option value="animated_image">Animiertes Bild</option><option value="video">Video</option></select></div><div class="fg"><label>Datei</label><input id="heroFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm" required></div></div><div class="fg" id="posterField" hidden><label>Video-Titelbild (optional)</label><input id="heroPoster" type="file" accept="image/jpeg,image/png,image/webp"></div><div class="admin-form-grid"><div class="fg"><label>Anzeigedauer (Sekunden)</label><input id="heroDuration" type="number" min="2" max="30" value="7"></div><label class="admin-toggle"><input id="heroLoop" type="checkbox" checked><span class="admin-toggle-track"></span><span>Wiederholen</span></label></div><button class="btn-send" type="submit" style="width:auto">Speichern</button></form><div id="heroList" class="admin-card-grid" style="margin-top:18px"></div></section>
</main></div></div></div>
<script src="js/vendor/supabase.js"></script><script src="js/admin-config.js"></script><script src="js/admin-supabase-client.js"></script><script src="js/admin-auth.js"></script><script src="js/admin-ui.js"></script><script src="js/admin-site-media.js"></script>
</body></html>
